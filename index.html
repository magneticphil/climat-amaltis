<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climat</title>
<meta name="theme-color" content="#f3f5f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f171b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Climat">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icone-180.png?v=2">
<link rel="icon" type="image/png" href="icone-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Style de l'app d'arrosage (polices, couleurs, onglets, pilules de salle) + cadrans d'instrument */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --sunk:#e8ecee; --line:#d3dadd;
  --ink:#16232a; --muted:#5b6b73; --accent:#1f6f8b; --accent-ink:#ffffff; --accent-soft:#dcecf2;
  --warn:#a45f12; --warn-soft:#f7ead8; --bad:#b4372f; --bad-soft:#f8e3e1; --ok:#1f7a5a; --ok-soft:#ddf0e8; --void:#9aa6ab;
  --target:#1f7a5a; --needle:#16232a; --meas:#1f6f8b;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f171b; --surface:#16222a; --sunk:#1c2b33; --line:#2a3b44;
  --ink:#e4ecef; --muted:#93a5ad; --accent:#5cb3d1; --accent-ink:#06222c; --accent-soft:#163846;
  --warn:#e3a35a; --warn-soft:#3a2a17; --bad:#f08a80; --bad-soft:#3d1e1b; --ok:#5fcfa3; --ok-soft:#15332a; --void:#5f6f76;
  --target:#5fcfa3; --needle:#e4ecef; --meas:#5cb3d1; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:.01em}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
html{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header.top .who{font-size:.85rem;color:var(--muted);text-align:right;line-height:1.25}
.iconbtn{border:0;background:var(--sunk);border-radius:8px;width:38px;height:38px;font-size:1.1rem}
.rooms{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.rooms button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 2px 6px;font-family:var(--f-display);font-size:1.1rem;font-weight:600;min-width:0;position:relative;line-height:1.1;text-align:center}
.rooms button small{display:block;font-family:var(--f-body);font-size:.68rem;font-weight:500;color:var(--muted)}
.rooms button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rooms button[aria-pressed="true"] small{color:var(--accent-ink);opacity:.8}
.rooms button i{position:absolute;top:3px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border-radius:var(--r);padding:4px;gap:4px}
.tabs button{border:0;background:transparent;padding:10px 2px;border-radius:8px;font-weight:600;color:var(--muted);font-size:.9rem}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.sit{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.sit b{font-family:var(--f-display);font-size:1.35rem}
.banner{padding:11px 13px;border-radius:8px;font-size:.9rem;line-height:1.4}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner b{font-weight:600}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;min-width:0}
.g.diff{border-color:var(--warn)}
.g .gl{display:flex;justify-content:space-between;width:100%;padding:0 2px}
.g svg{width:100%;max-width:170px;height:auto;display:block}
.g .val{font-family:var(--f-display);font-size:2rem;font-weight:600;line-height:1;margin-top:2px;font-variant-numeric:tabular-nums}
.g .val small{font-size:.95rem;color:var(--muted);font-weight:500;margin-left:2px}
.g .sub{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);margin-top:4px;text-align:center;line-height:1.35}
.g .sub .t{color:var(--target)} .g .sub .m{color:var(--meas)}
.step{display:flex;gap:8px;margin-top:8px;width:100%}
.step button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;height:40px;font-size:1.3rem;font-weight:600;color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
input[type=date],input[type=time],input[type=text],input[type=password],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:46px;font-size:16px}
textarea{min-height:60px}
.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:600;background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-size:1.05rem;padding:15px}
.btn.small{padding:8px 12px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.check{display:flex;gap:10px;align-items:center;font-size:.92rem}
.check input{width:20px;height:20px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.wk{width:100%;border-collapse:collapse;font-size:.9rem}
.wk th,.wk td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.wk th:first-child,.wk td:first-child{text-align:left}
.wk th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.wk tr.now td{font-weight:600;background:var(--accent-soft)}
.wk tr.sel td{background:var(--warn-soft)}
.wk tr.off td{color:var(--void)}
.wk tr[data-s]{cursor:pointer}
.wk td.w{font-family:var(--f-display);font-size:1.05rem;font-weight:600}
.wk td .d{display:block;font-family:var(--f-body);font-size:.68rem;color:var(--muted);font-weight:400}
.dv{color:var(--warn);font-weight:700}
.seg{display:flex;background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:8px 4px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.seg button:disabled{opacity:.4}
.ed{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ed .e{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 6px 8px;text-align:center}
.ed .e.chg{border-color:var(--warn)}
.ed .e b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.ed .e .was{font-family:var(--f-mono);font-size:.66rem;color:var(--muted)}
.ed .e .pm{display:flex;gap:4px;margin-top:4px}
.ed .e .pm button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:6px;height:32px;font-weight:700;color:var(--accent)}
.big{display:flex;align-items:center;justify-content:space-between;gap:10px}
.big b{font-family:var(--f-display);font-size:1.8rem;font-weight:600}
.big .pm{display:flex;gap:6px}
.big .pm button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:48px;height:44px;font-size:1.3rem;font-weight:700;color:var(--accent)}
.cmp2{width:100%;border-collapse:collapse;font-size:.86rem}
.cmp2 td,.cmp2 th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.cmp2 th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cmp2 td.n{color:var(--warn);font-weight:600}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.steps li:last-child{border-bottom:0}
.steps li .dt{color:var(--muted)}
.steps li b{font-family:var(--f-mono);font-weight:500;font-size:.84rem}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
ul.list .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem;min-width:88px}
ul.list .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
ul.list .k.r{color:var(--accent)} ul.list .k.c{color:var(--warn)} ul.list .k.x{color:var(--bad)}
ul.list .t{font-size:.9rem}
ul.list .meta{grid-column:2;font-size:.78rem;color:var(--muted)}
.empty{padding:14px;text-align:center;color:var(--muted);font-size:.92rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:.92rem;z-index:20;max-width:calc(100% - 32px);text-align:center}
#busy{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);transition:width .4s;z-index:30}
.login{max-width:380px;margin:12vh auto 0}
.login img{width:56px;height:56px;border-radius:13px}
details summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:.9rem}
details[open] summary{margin-bottom:10px}
@media (max-width:370px){.g .val{font-size:1.7rem}.ed{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="busy"></div>

<div class="wrap" id="login" hidden>
  <div class="login panel">
    <img src="icone-192.png?v=2" alt="">
    <h1>Climat</h1>
    <p class="muted" style="margin:0">Cibles par semaine, réglages du panneau et descente, écrits dans le registre de culture.</p>
    <div id="apiBloc" class="field"><span class="label">Adresse du script (…/exec)</span><input type="text" id="apiUrl" autocomplete="off"></div>
    <div class="field"><span class="label">Code d'accès</span><input type="text" id="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" style="-webkit-text-security:disc"></div>
    <button class="btn primary" id="go">Entrer</button>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <h1>Climat</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="who" id="who"></div>
      <button class="iconbtn" id="maj" aria-label="Relire les registres" title="Relire les registres">⟳</button>
    </div>
  </header>
  <div class="rooms" id="rooms" aria-label="Salle"></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-t="reglage" aria-selected="true">Réglage</button>
    <button role="tab" data-t="cibles" aria-selected="false">Cibles</button>
    <button role="tab" data-t="descente" aria-selected="false">Descente</button>
    <button role="tab" data-t="hist" aria-selected="false">Historique</button>
  </div>
  <div id="vue" style="display:flex;flex-direction:column;gap:14px"></div>
  <div class="muted" id="fileInfo" style="font-size:.8rem;text-align:center"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ====== Adresse du déploiement Apps Script (…/exec) ====== */
const API_DEFAUT = 'https://script.google.com/macros/s/AKfycby-RpH1VcdhLQhvyVE0V6LYiXFy6RZ3agSWkf38FSCaOg6Ky-3y4o3barzi2dp144GOpA/exec';
let API_URL = /^https:\/\//.test(API_DEFAUT) ? API_DEFAUT : (load('clim_api') || API_DEFAUT);

const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const JOURS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const CH = {
  tj:   { nom: 'T jour',  u: '°C',  pas: 0.5, min: 18,  max: 32,   tol: 0.3 },
  tn:   { nom: 'T nuit',  u: '°C',  pas: 0.5, min: 16,  max: 30,   tol: 0.3 },
  hrj:  { nom: 'HR jour', u: '%',   pas: 1,   min: 30,  max: 80,   tol: 1.5 },
  hrn:  { nom: 'HR nuit', u: '%',   pas: 1,   min: 30,  max: 80,   tol: 1.5 },
  co2:  { nom: 'CO₂',     u: 'ppm', pas: 50,  min: 400, max: 1600, tol: 60 },
  rampe:{ nom: 'Rampe',   u: 'h',   pas: 0.5, min: 0,   max: 3,    tol: 0.25 }
};
const ORDRE = ['tj', 'tn', 'hrj', 'hrn', 'co2', 'rampe'];
const S = { code: null, acc: null, salle: null, det: {}, tab: 'reglage', draft: null, file: [], sel: null, ed: null, portee: 'une', desc: null };

function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r1 = v => Math.round(v * 10) / 10;
const f1 = v => v == null || v === '' || isNaN(v) ? '—' : String(r1(+v)).replace('.', ',');
const f2 = v => v == null || v === '' || isNaN(v) ? '—' : (+v).toFixed(2).replace('.', ',');
const toD = s => { const p = s.slice(0, 10).split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); };
const fD = s => { if (!s || !/^\d{4}-\d{2}-\d{2}/.test(s)) return s || ''; const d = toD(s); return JOURS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MOIS[d.getUTCMonth()]; };
const fC = s => { if (!s || !/^\d{4}-\d{2}-\d{2}/.test(s)) return s || ''; const d = toD(s); return d.getUTCDate() + ' ' + MOIS[d.getUTCMonth()]; };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const hNow = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const plusJ = (s, n) => { const d = toD(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 3200); }
let busyN = 0;
function busy(on) { busyN = Math.max(0, busyN + (on ? 1 : -1)); $('busy').style.width = busyN ? '70%' : '0'; }
const svp = t => 0.6108 * Math.exp(17.27 * t / (t + 237.3));
const vpdF = (t, hr, d) => svp(t - d) - svp(t) * hr / 100;

/* ---------- Serveur ---------- */
function api(action, p, silencieux) {
  if (/^COLLER_ICI/.test(API_URL)) return Promise.reject(Object.assign(new Error("L'adresse du script n'est pas configurée."), { serveur: true }));
  if (!silencieux) busy(true);
  const envoi = () => fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, code: S.code, p: p || {} }), redirect: 'follow' })
    .then(r => { if (!r.ok) throw new Error('Erreur réseau (' + r.status + ')'); return r.json(); });
  return envoi().catch(() => new Promise(ok => setTimeout(ok, 1500)).then(envoi))
    .then(j => { if (!silencieux) busy(false); if (!j.ok) { const e = new Error(j.erreur || 'Erreur'); e.auth = j.auth === false; e.serveur = true; throw e; } return j; },
          e => { if (!silencieux) busy(false); throw e; });
}
function enFile(action, p) { S.file.push({ action, p }); store('clim_file', S.file); majFile(); }
function majFile() { $('fileInfo').textContent = S.file.length ? S.file.length + ' saisie(s) en attente d\'envoi — renvoi automatique' : ''; }
let vidage = false;
async function viderFile() {
  if (vidage || !S.file.length) return; vidage = true;
  try { while (S.file.length) { const it = S.file[0];
    try { await api(it.action, it.p, true); S.file.shift(); store('clim_file', S.file); }
    catch (e) { if (e.serveur) { toast('Saisie refusée : ' + e.message); S.file.shift(); store('clim_file', S.file); } else break; } } }
  finally { vidage = false; majFile(); }
}
setInterval(viderFile, 30000); window.addEventListener('online', viderFile);

/* ---------- Connexion ---------- */
async function connexion(code) {
  S.code = code;
  try { await api('ping'); store('clim_code', code); $('login').hidden = true; $('app').hidden = false; await charger(); viderFile(); }
  catch (e) { S.code = null; store('clim_code', null); $('app').hidden = true; $('login').hidden = false; if (code) toast(e.auth ? 'Code refusé. Vérifiez les 6 chiffres (après 10 essais ratés, attendez 10 minutes).' : e.message); }
}
$('go').onclick = () => {
  const u = $('apiUrl').value.trim();
  if (u) { if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)) return toast('Adresse invalide : elle doit se terminer par /exec.'); API_URL = u; store('clim_api', u); }
  connexion($('code').value.trim());
};
$('code').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
if (/^https:\/\//.test(API_URL)) $('apiBloc').hidden = true;

async function charger(force) {
  const r = await api('accueil', { force: !!force });
  S.acc = r; store('clim_acc', r);
  if (force) S.det = {};
  if (!S.salle || !r.salles.find(x => x.salle === S.salle)) { const a = r.salles.find(s => s.rappel); S.salle = (a || r.salles[1] || r.salles[0]).salle; }
  /* les positions des cadrans sont conservées après un enregistrement ou une actualisation */
  rendre();
  prechargerDetails();
}
let prechargement = false;
async function prechargerDetails() {
  if (prechargement) return; prechargement = true;
  try { for (const s of S.acc.salles) { if (!S.det[s.salle]) { try { S.det[s.salle] = await api('salle', { salle: s.salle }, true); } catch (e) { break; } } } }
  finally { prechargement = false; }
}
$('maj').onclick = () => charger(true).then(() => toast('Registres relus.')).catch(e => toast(e.message));
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; rendre(); });

const res = () => S.acc && S.acc.salles.find(x => x.salle === S.salle);
async function detail(force) {
  if (S.det[S.salle] && !force) return S.det[S.salle];
  const r = await api('salle', { salle: S.salle, force: !!force });
  S.det[S.salle] = r; return r;
}

/* ---------- Rendu général ---------- */
function rendre() {
  if (!S.acc) return;
  $('who').innerHTML = fD(S.acc.aujourdhui) + '<br>plan ' + esc(S.acc.plan.version || '?');
  $('rooms').innerHTML = S.acc.salles.map(s => {
    const si = s.situation || {};

/* ---------- Cadran d'instrument ---------- */
function cadran(k, val, cible, prop, mes) {
  const c = CH[k], cx = 80, cy = 80, R = 60;
  const f = v => Math.max(0, Math.min(1, (v - c.min) / (c.max - c.min)));
  const pt = (v, rr) => { const a = Math.PI * (1 - f(v)); return [cx + rr * Math.cos(a), cy - rr * Math.sin(a)]; };
  const arc = (a, b, rr) => { const p = pt(a, rr), q = pt(b, rr); return `M${p[0].toFixed(1)} ${p[1].toFixed(1)} A${rr} ${rr} 0 0 1 ${q[0].toFixed(1)} ${q[1].toFixed(1)}`; };
  let s = `<svg viewBox="0 0 160 88" aria-hidden="true"><path d="${arc(c.min, c.max, R)}" fill="none" stroke="var(--line)" stroke-width="9" stroke-linecap="round"/>`;
  for (let i = 0; i <= 10; i++) { const v = c.min + (c.max - c.min) * i / 10, a = pt(v, R + 8), b = pt(v, R + (i % 5 ? 11 : 15)); s += `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="var(--muted)" stroke-width="1"/>`; }
  if (prop != null) s += `<path d="${arc(prop - c.tol * 2, prop + c.tol * 2, R)}" fill="none" stroke="var(--target)" stroke-width="9"/>`;
  if (cible != null && cible !== prop) { const a = pt(cible, R - 7), b = pt(cible, R + 6); s += `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="var(--target)" stroke-width="2" stroke-dasharray="2 2"/>`; }
  if (mes != null) { const m = pt(mes, R); s += `<circle cx="${m[0].toFixed(1)}" cy="${m[1].toFixed(1)}" r="5" fill="var(--meas)" stroke="var(--surface)" stroke-width="2"/>`; }
  if (val != null) { const n = pt(val, R - 12); s += `<line x1="${cx}" y1="${cy}" x2="${n[0].toFixed(1)}" y2="${n[1].toFixed(1)}" stroke="var(--needle)" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="var(--needle)"/>`; }
  return s + '</svg>';
}

    <div class="pm"><button id="d_m" aria-label="Récolter un jour plus tôt">−</button><button id="d_p" aria-label="Récolter un jour plus tard">+</button></div></div>
    <div class="btns"><button class="btn small" data-w="-7">−1 semaine</button><button class="btn small" data-w="-3">−3 j</button><button class="btn small" data-w="0">Actuelle</button></div>
    <div class="row2"><div class="field"><span class="label">T max par jour</span><div class="seg">${[0.5, 1, 1.5].map(v => `<button data-t="${v}" aria-pressed="${D.maxT === v}">${f1(v)}°</button>`).join('')}</div></div>
    <div class="field"><span class="label">HR max par jour</span><div class="seg">${[2, 3, 5].map(v => `<button data-h="${v}" aria-pressed="${D.maxHR === v}">${v} pts</button>`).join('')}</div></div></div>
    <div class="muted" style="font-size:.8rem">Flo 7 à Flo 10 sont comptées à rebours depuis la récolte. Si la récolte avance, l'app calcule un rattrapage jour par jour (jours ouvrables), sans dépasser ces pas.</div></div>
    <div id="d_ap" style="display:flex;flex-direction:column;gap:14px"></div>`;
  $('vue').innerHTML = h;
  const re = () => { D.ap = null; vueDescente(); };
  $('d_m').onclick = () => { D.flo--; re(); }; $('d_p').onclick = () => { D.flo++; re(); };
  $('vue').querySelectorAll('[data-w]').forEach(b => b.onclick = () => { D.flo = +b.dataset.w === 0 ? r.flo : r.flo + +b.dataset.w; re(); });
  $('vue').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { D.maxT = +b.dataset.t; re(); });
  $('vue').querySelectorAll('[data-h]').forEach(b => b.onclick = () => { D.maxHR = +b.dataset.h; re(); });
  if (D.flo === r.flo) { $('d_ap').innerHTML = '<div class="panel"><div class="empty">Changez la date de récolte pour voir l\'effet sur la descente.</div></div>'; return; }
  if (D.ap) return apercu(s, D);
  $('d_ap').innerHTML = '<div class="panel"><div class="empty">Calcul…</div></div>';
  clearTimeout(S._dt);
  S._dt = setTimeout(async () => {
    try { const a = await api('descenteApercu', { salle: s.salle, flo: D.flo, maxT: D.maxT, maxHR: D.maxHR }); if (S.desc === D && a.flo === D.flo) { D.ap = a; if (S.tab === 'descente') apercu(s, D); } }
    catch (e) { if ($('d_ap')) $('d_ap').innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
  }, 400);
}
function apercu(s, D) {
  const a = D.ap, sem = ['Flo 5', 'Flo 6', 'Flo 7', 'Flo 8', 'Flo 9', 'Flo 10'];
  const date = (L, w) => { const e = L.find(x => x.semaine === w); return e ? fC(e.conseillee) : '—'; };
  let h = `<div class="panel"><span class="label">Calendrier de descente</span>
    <table class="cmp2"><thead><tr><th>Semaine</th><th>Actuel (${a.ancienFlo} j)</th><th>Nouveau (${a.flo} j)</th></tr></thead><tbody>
    ${sem.map(w => { const o = date(a.ancien, w), n = date(a.nouveau, w); return `<tr><td>${w}</td><td>${o}</td><td class="${o !== n ? 'n' : ''}">${n}</td></tr>`; }).join('')}
    </tbody></table>
    <div class="muted" style="font-size:.85rem">Aujourd'hui : ${esc(a.semaineAvant)} → <b>${esc(a.semaineApres)}</b> · départ : ${esc(a.departSource)} (T ${f1(a.depart.tj)}/${f1(a.depart.tn)} · HR ${f1(a.depart.hrj)}/${f1(a.depart.hrn)})</div></div>
    <div class="panel"><span class="label">Réglages proposés au panneau</span>`;
  if (!a.etapes.length) h += '<div class="empty">Aucun rattrapage nécessaire : le réglage actuel correspond déjà.</div>';
  else h += '<ul class="steps">' + a.etapes.map(e => `<li><span class="dt">${fD(e.date)}<br><span class="label">${esc(e.semaine)}</span></span><span><b>T ${f1(e.val.tj)} / ${f1(e.val.tn)} °C · HR ${f1(e.val.hrj)} / ${f1(e.val.hrn)} % · CO₂ ${f1(e.val.co2)}</b>${e.rejoint ? '<br><span style="color:var(--ok);font-size:.8rem;font-weight:600">consigne rattrapée</span>' : ''}</span></li>`).join('') + '</ul>';
  h += `<div class="field"><span class="label">Motif</span><input type="text" id="d_motif" placeholder="Ex. trichomes prêts, récolte avancée"></div>
    <button class="btn primary" id="d_ok">Modifier la récolte au registre et activer le plan</button>
    <div class="muted" style="font-size:.78rem">Écrit FLO days = ${a.flo} dans le registre (le calendrier suivra), fige les consignes des jours passés et note le changement dans « Observations / écarts ».</div></div>`;
  $('d_ap').innerHTML = h;
  $('d_ok').onclick = async () => {
    if (!confirm('Modifier le registre de ' + s.salle + ' : FLO ' + a.ancienFlo + ' → ' + a.flo + ' j (récolte ' + fC(a.recolte) + ') ?')) return;
    $('d_ok').disabled = true;
    try { await api('descente', { salle: s.salle, flo: a.flo, maxT: D.maxT, maxHR: D.maxHR, motif: $('d_motif').value.trim() });
      toast('Registre modifié · plan de rattrapage actif'); S.desc = null; S.det[s.salle] = null; S.tab = 'reglage'; await charger(true); }
    catch (e) { toast(e.message); $('d_ok').disabled = false; }
  };
}

/* ---------- Onglet Historique ---------- */
async function vueHist() {
  const s = res(); if (!s) return;
  $('vue').innerHTML = situation(s) + '<div class="panel"><div class="empty">Chargement…</div></div>';
  let r; try { r = await api('historique', { salle: s.salle }); } catch (e) { $('vue').innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; return; }
  if (S.tab !== 'hist' || s.salle !== S.salle) return;
  const q = x => `<span class="d">${esc(fD(x.quand))}<br>${esc(String(x.quand).slice(11))}</span>`;
  let h = situation(s) + '<div class="panel"><div class="sit"><span class="label">Traces</span><button class="link" id="h_exp">Exporter le registre GACP</button></div>';
  if (!r.items.length) h += '<div class="empty">Aucune trace pour cette salle.</div>';
  else h += '<ul class="list">' + r.items.map(x => {
    if (x.type === 'réglage') { const v = x.val || {}; return `<li>${q(x)}<span><span class="k r">Réglage panneau · ${esc(x.semaine)}</span><div class="t">T ${f1(v.tj)}/${f1(v.tn)} °C · HR ${f1(v.hrj)}/${f1(v.hrn)} % · CO₂ ${f1(v.co2)} · rampe ${f1(v.rampe)} h</div></span>${x.ecarts || x.note ? `<span class="meta">${esc([x.ecarts, x.note].filter(Boolean).join(' — '))}</span>` : ''}</li>`; }
    if (x.type === 'cible') return `<li>${q(x)}<span><span class="k c">Cible modifiée · ${esc(x.semaine)}</span><div class="t">${esc(x.champ)} ${f1(x.de)} → ${f1(x.a)}</div></span>${x.motif ? `<span class="meta">${esc(x.motif)}</span>` : ''}</li>`;
    return `<li>${q(x)}<span><span class="k x">Récolte modifiée</span><div class="t">FLO ${esc(x.de)} → ${esc(x.a)} j · récolte ${fC(x.recolte)}</div></span>${x.motif ? `<span class="meta">${esc(x.motif)}</span>` : ''}</li>`;
  }).join('') + '</ul>';
  h += '</div><div class="muted" style="font-size:.78rem;text-align:center">Réglages et cibles sont aussi écrits dans le registre de culture : bloc « Réglé automate », tableau de consignes et « Observations / écarts ».</div>';
  $('vue').innerHTML = h;
  $('h_exp').onclick = async () => { try { const x = await api('exporter', { salle: s.salle }); toast(x.lignes + ' ligne(s) exportée(s)'); window.open(x.url, '_blank'); } catch (e) { toast(e.message); } };
}

if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- Démarrage ---------- */
S.file = load('clim_file') || [];
const acc0 = load('clim_acc');
if (acc0 && acc0.salles && acc0.salles[0] && acc0.salles[0].situation) S.acc = acc0;
const code0 = load('clim_code');
if (code0) { $('app').hidden = false; if (S.acc) { S.salle = (S.acc.salles.find(x => x.rappel) || S.acc.salles[1]).salle; rendre(); } connexion(code0); } else $('login').hidden = false;
</script>
</body>
</html>
